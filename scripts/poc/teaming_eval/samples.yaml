# F9 离线 eval 闭环 · Manager 组队质量评测样本集（版本化金标准）
#
# 用途：scripts/poc/teaming_eval/run_teaming_eval.py 的输入。
# 每条样本字段：
#   id                  样本编号（S01...），报告中按 id 引用
#   text                真实需求文本（尽量 verbatim 摘自 source，仅去尾随引号/截断标记）
#   gold_experts        人工标注的期望专家集合（agent_id，空列表 = 不应派出任何领域专家）
#   needs_clarification 期望是否需要先澄清/补全输入（true = 应先 ask_user 而非直接组队执行）
#   source              文本来源（仓库内真实材料路径；E2E-* 指 evidence/e2e-2026-08-21 实测案例）
#   note                标注理由/口径说明（可选）
#
# 标注口径：
#   - gold_experts 以 data/ai/agent_ability.yaml 各 agent 的 summary/detail 契约为准绳
#     （适用场景命中 → 应派；not_suitable_for 命中 → 不应派）。
#   - "最小专家集合"原则：只列完成任务必需的专家，可选增强（如顺手美化）不计入。
#   - 领域词命中但信息不足（缺输入文件/分组/模态）时 needs_clarification=true。
version: 1
annotated_by: 人工标注（2026-08-21，依据 agent_ability.yaml 能力契约）
