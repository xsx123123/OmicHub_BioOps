[project]
name = "cygnusxtools"
version = "0.1.0"
description = "CygnusX offline maintenance and database build toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "CygnusX Team" },
]
dependencies = [
    "loguru>=0.7.2",
    "pyyaml>=6.0.1",
    "rich-argparse>=1.7.0",
]

[project.optional-dependencies]
pretty = [
    "rich>=13.0.0",
    "rich-gradient>=0.1.7",
]

[project.scripts]
cygnusxtools = "cygnusxtools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cygnusxtools"]
include = [
    "cygnusxtools/config/*.yaml",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
