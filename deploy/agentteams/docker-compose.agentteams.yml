services:
  omichub-agentteams-gateway:
    container_name: omichub-agentteams-gateway
    build:
      context: ../../integrations/agentteams/gateway
    env_file:
      - ${GATEWAY_ENV_FILE:-./gateway.env}
    ports:
      - "${AGENTTEAMS_GATEWAY_BIND_HOST:-127.0.0.1}:${AGENTTEAMS_GATEWAY_PORT:-8089}:8081"
    volumes:
      - agentteams_gateway_audit:/var/lib/omichub-agent-gateway
    networks: [agentteams_control, agentteams_bridge_state, omichub_bridge_gateway, agentteams_matrix_dev, omichub_net]
    depends_on:
      omichub-agentteams-state:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8081/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  omichub-agentteams-bridge:
    container_name: omichub-agentteams-bridge
    build:
      context: ../../integrations/agentteams/bridge
    command: ["uvicorn", "omichub_agentteams_bridge.app:app", "--host", "0.0.0.0", "--port", "8080"]
    env_file:
      - ${BRIDGE_ENV_FILE:-./bridge.env}
    environment:
      BRIDGE_CASE_GC_DAYS: ${BRIDGE_CASE_GC_DAYS:-7}
    ports:
      - "${AGENTTEAMS_BRIDGE_BIND_HOST:-127.0.0.1}:${AGENTTEAMS_BRIDGE_PORT:-8088}:8080"
    volumes:
      - agentteams_bridge_audit:/var/lib/omichub-agentteams-bridge
    depends_on:
      omichub-agentteams-state:
        condition: service_healthy
    networks: [agentteams_control, agentteams_bridge_state, omichub_bridge_gateway, omichub_net]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  omichub-agentteams-state:
    container_name: omichub-agentteams-state
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - agentteams_bridge_state:/data
    networks: [agentteams_bridge_state]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  agentteams-worker-code:
    container_name: agentteams-worker-code
    profiles: [agentteams-acceptance]
    build:
      context: ../../integrations/agentteams/worker
    environment:
      AGENTTEAMS_WORKER_MODE: acceptance
      AGENTTEAMS_BRIDGE_BASE_URL: http://omichub-agentteams-bridge:8080/v1
      AGENTTEAMS_WORKER_IDENTITY: agent-code
      AGENTTEAMS_BRIDGE_TOKEN: ${AGENTTEAMS_AGENT_CODE_TOKEN:-}
      AGENTTEAMS_WORKER_AUTOCOMPLETE_DEMO: "true"
      AGENTTEAMS_WORKER_ACCEPT_CASE_PREFIX: agentteams-acceptance-
      AGENTTEAMS_WORKER_POLL_SECONDS: "2"
    depends_on:
      omichub-agentteams-bridge:
        condition: service_healthy
    networks: [agentteams_control]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  agentteams-worker-viz:
    container_name: agentteams-worker-viz
    profiles: [agentteams-acceptance]
    build:
      context: ../../integrations/agentteams/worker
    environment:
      AGENTTEAMS_WORKER_MODE: acceptance
      AGENTTEAMS_BRIDGE_BASE_URL: http://omichub-agentteams-bridge:8080/v1
      AGENTTEAMS_WORKER_IDENTITY: agent-viz
      AGENTTEAMS_BRIDGE_TOKEN: ${AGENTTEAMS_AGENT_VIZ_TOKEN:-}
      AGENTTEAMS_WORKER_AUTOCOMPLETE_DEMO: "true"
      AGENTTEAMS_WORKER_ACCEPT_CASE_PREFIX: agentteams-acceptance-
      AGENTTEAMS_WORKER_POLL_SECONDS: "2"
    depends_on:
      omichub-agentteams-bridge:
        condition: service_healthy
    networks: [agentteams_control]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  agentteams-worker-scrna:
    container_name: agentteams-worker-scrna
    profiles: [agentteams-acceptance]
    build:
      context: ../../integrations/agentteams/worker
    environment:
      AGENTTEAMS_WORKER_MODE: acceptance
      AGENTTEAMS_BRIDGE_BASE_URL: http://omichub-agentteams-bridge:8080/v1
      AGENTTEAMS_WORKER_IDENTITY: agent-scrna
      AGENTTEAMS_BRIDGE_TOKEN: ${AGENTTEAMS_AGENT_SCRNA_TOKEN:-}
      AGENTTEAMS_WORKER_AUTOCOMPLETE_DEMO: "true"
      AGENTTEAMS_WORKER_ACCEPT_CASE_PREFIX: agentteams-acceptance-
      AGENTTEAMS_WORKER_POLL_SECONDS: "2"
    depends_on:
      omichub-agentteams-bridge:
        condition: service_healthy
    networks: [agentteams_control]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  agentteams-worker-professional-pool:
    profiles: [agentteams-production]
    build:
      context: ../../integrations/agentteams/worker
    env_file:
      - ${WORKER_ENV_FILE:-./worker.env}
    environment:
      AGENTTEAMS_WORKER_MODE: production
      AGENTTEAMS_BRIDGE_BASE_URL: http://omichub-agentteams-bridge:8080/v1
      AGENTTEAMS_WORKER_IDENTITIES: agent-data,agent-rnaseq,agent-atacseq,agent-scrna,agent-scrna-upstream,agent-scrna-integration,agent-scrna-advanced,agent-code,agent-viz,agent-qc,agent-delivery,agent-cloud-ops,agent-general,agent-mcp-builder
      AGENTTEAMS_WORKER_MAX_CONCURRENT: ${AGENTTEAMS_PROFESSIONAL_POOL_CONCURRENCY:-4}
      AGENTTEAMS_WORKER_POLL_SECONDS: "2"
    deploy:
      replicas: ${AGENTTEAMS_PROFESSIONAL_POOL_REPLICAS:-2}
    depends_on:
      omichub-agentteams-bridge:
        condition: service_healthy
    networks: [agentteams_control]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  agentteams-worker-analysis-production:
    container_name: agentteams-worker-analysis
    profiles: [agentteams-production]
    build:
      context: ../../integrations/agentteams/worker
    env_file:
      - ${WORKER_ENV_FILE:-./worker.env}
    environment:
      AGENTTEAMS_WORKER_MODE: analysis
      AGENTTEAMS_BRIDGE_BASE_URL: http://omichub-agentteams-bridge:8080/v1
      AGENTTEAMS_WORKER_IDENTITY: analysis-worker
      AGENTTEAMS_BRIDGE_TOKEN: ${AGENTTEAMS_ANALYSIS_WORKER_TOKEN:-}
      AGENTTEAMS_WORKER_POLL_SECONDS: "2"
    depends_on:
      omichub-agentteams-bridge:
        condition: service_healthy
    networks: [agentteams_control]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  agentteams-worker-quality-production:
    container_name: agentteams-worker-quality
    profiles: [agentteams-production]
    build:
      context: ../../integrations/agentteams/worker
    env_file:
      - ${WORKER_ENV_FILE:-./worker.env}
    environment:
      AGENTTEAMS_WORKER_MODE: quality
      AGENTTEAMS_BRIDGE_BASE_URL: http://omichub-agentteams-bridge:8080/v1
      AGENTTEAMS_WORKER_IDENTITY: quality-auditor
      AGENTTEAMS_BRIDGE_TOKEN: ${AGENTTEAMS_AGENT_QC_TOKEN:-}
      AGENTTEAMS_WORKER_POLL_SECONDS: "5"
    depends_on:
      omichub-agentteams-bridge:
        condition: service_healthy
    networks: [agentteams_control]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  agentteams-worker-delivery-production:
    container_name: agentteams-worker-delivery
    profiles: [agentteams-production]
    build:
      context: ../../integrations/agentteams/worker
    env_file:
      - ${WORKER_ENV_FILE:-./worker.env}
    environment:
      AGENTTEAMS_WORKER_MODE: delivery
      AGENTTEAMS_BRIDGE_BASE_URL: http://omichub-agentteams-bridge:8080/v1
      AGENTTEAMS_WORKER_IDENTITY: delivery-reporter
      AGENTTEAMS_BRIDGE_TOKEN: ${AGENTTEAMS_AGENT_DELIVERY_TOKEN:-}
      AGENTTEAMS_WORKER_POLL_SECONDS: "5"
    depends_on:
      omichub-agentteams-bridge:
        condition: service_healthy
    networks: [agentteams_control]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

networks:
  agentteams_control:
    name: omichub_agentteams_control
    internal: true
  agentteams_bridge_state:
    name: omichub_agentteams_bridge_state
    internal: true
  omichub_bridge_gateway:
    name: ${OMICHUB_BRIDGE_GATEWAY_NETWORK:-omichub_bridge_gateway}
    external: true
  omichub_net:
    name: omichub_net
    external: true
  agentteams_matrix_dev:
    name: matrix-dev_default
    external: true

volumes:
  agentteams_bridge_audit:
  agentteams_bridge_state:
  agentteams_gateway_audit:
