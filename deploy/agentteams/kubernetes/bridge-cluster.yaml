apiVersion: v1
kind: ServiceAccount
metadata:
  name: omichub-agentteams-bridge
  namespace: agentteams-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: omichub-agentteams-worker
  namespace: agentteams-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omichub-agentteams-bridge
  namespace: agentteams-system
  labels:
    app.kubernetes.io/name: omichub-agentteams-bridge
    app.kubernetes.io/part-of: omichub-agentteams
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: omichub-agentteams-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omichub-agentteams-bridge
        app.kubernetes.io/part-of: omichub-agentteams
    spec:
      serviceAccountName: omichub-agentteams-bridge
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bridge
          image: omichub-agentteams-bridge:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["uvicorn", "omichub_agentteams_bridge.app:app", "--host", "0.0.0.0", "--port", "8080"]
          envFrom:
            - secretRef: {name: omichub-agentteams-bridge-runtime}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 15}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {medium: Memory}}]
---
apiVersion: v1
kind: Service
metadata:
  name: omichub-agentteams-bridge
  namespace: agentteams-system
spec:
  selector: {app.kubernetes.io/name: omichub-agentteams-bridge}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: omichub-agentteams-bridge
  namespace: agentteams-system
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: omichub-agentteams-bridge}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: omichub-agentteams-bridge
  namespace: agentteams-system
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: omichub-agentteams-bridge}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omichub-agentteams-worker-code
  namespace: agentteams-system
  labels: {app.kubernetes.io/name: omichub-agentteams-worker-code, app.kubernetes.io/part-of: omichub-agentteams}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: omichub-agentteams-worker-code}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: omichub-agentteams-worker-code, app.kubernetes.io/component: worker, app.kubernetes.io/part-of: omichub-agentteams}
    spec:
      serviceAccountName: omichub-agentteams-worker
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: omichub-agentteams-worker:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: AGENTTEAMS_WORKER_MODE, value: production}
            - {name: AGENTTEAMS_BRIDGE_BASE_URL, value: http://omichub-agentteams-bridge:8080/v1}
            - {name: AGENTTEAMS_WORKER_IDENTITY, value: agent-code}
            - {name: AGENTTEAMS_POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: AGENTTEAMS_BRIDGE_TOKEN, valueFrom: {secretKeyRef: {name: omichub-agentteams-worker-tokens, key: agent-code-token}}}
          resources: {requests: {cpu: 200m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {medium: Memory}}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: omichub-agentteams-worker-code, namespace: agentteams-system}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: omichub-agentteams-worker-code}
  minReplicas: 2
  maxReplicas: 10
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
---
