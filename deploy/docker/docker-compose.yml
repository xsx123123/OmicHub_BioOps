# ============================================
# OmicHub Docker Compose - 开发环境
# 用法: docker compose -f deploy/docker/docker-compose.yml up -d
# ============================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # ===== 反向代理 =====
  nginx:
    image: nginx:alpine
    container_name: omichub-nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${OMICHUB_HTTP_BIND_HOST:-0.0.0.0}:${OMICHUB_HTTP_PORT:-8888}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../frontend/dist:/usr/share/nginx/html:ro
      # JBrowse 2 静态产物（scripts/download_jbrowse2.sh 下载至此）
      # 挂到独立路径 /var/www/jbrowse2，避免与只读的 dist(/usr/share/nginx/html) 子挂载冲突
      - ../../pipelines/jbrowse2:/var/www/jbrowse2:ro
      # 数据文件：经 /tracks/ 路径供 JBrowse 2 流式读取（只读）
      - ${OMICHUB_DATA_ROOT:-/data/omichub}:/data/omichub:ro
      # Nginx 访问/错误日志持久化到宿主机，避免容器重建丢失
      - ${OMICHUB_DATA_ROOT:-/data/omichub}/logs/nginx:/var/log/nginx
    depends_on:
      - web
    networks:
      - app_net

  # ===== FastAPI 主应用 =====
  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SNAKEMAKE_LOGGER_PLUGIN_REF: ${SNAKEMAKE_LOGGER_PLUGIN_REF:-main}
        # 由 Makefile 部署 target 导出（git rev-parse --short HEAD / UTC 构建时间），缺省 unknown。
        OMICHUB_BUILD_SHA: ${OMICHUB_BUILD_SHA:-unknown}
        OMICHUB_BUILD_TIME: ${OMICHUB_BUILD_TIME:-unknown}
    container_name: omichub-web
    restart: unless-stopped
    logging: *default-logging
    user: "${PUID:-1000}:${PGID:-1000}"   # 以宿主用户运行，避免 root；写入挂载卷文件归宿主所有
    group_add:
      - "${DOCKER_GID:-987}"              # 加入宿主 docker 组，授权访问 docker.sock（终端/沙盒容器管理）
    env_file:
      - ../../.env
    environment:
      - APP_ENV=development
      - POSTGRES_HOST=db
      - REDIS_HOST=cache
      - SERVICE_NAME=web
      - PYTHONPATH=/app/src
      - AL_API_KEY=${AL_API_KEY}
      - ARK_API_KEY=${ARK_API_KEY}
      - HOME=/tmp                          # uid 1000 无 passwd 条目，显式 HOME 防 expanduser 失败
      - RUN_MIGRATIONS=1                   # 容器启动时由 entrypoint 自动跑 alembic upgrade head
      - OMICHUB_LOG_DIR=/app/logs          # 挂载到宿主机 /data/omichub/logs/app，保证容器重建后不丢失
      - SKILLS_DIR=/data/omichub/skills    # SKILL.md 技能库落可写共享卷（/app/data 只读；Settings 无 env_prefix）
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - ../../src:/app/src:ro  # 开发环境热重载
      - ../../flows:/app/flows:ro  # 流程 YAML 配置（热重载）
      - ../../tool_configs:/app/tool_configs  # 工具箱配置（热重载；BLAST 数据库 YAML 需要可写）
      - ../../docs:/app/docs  # 知识库文档（meta.yaml + *.md，在线编辑与图片上传需要可写）
      - ../../wiki:/app/wiki:ro  # 平台 Wiki 正文（知识库自动集合，只读挂载）
      - ../../data:/app/data:ro  # AI Provider YAML 配置（热重载）
      - ../../alembic:/app/alembic:ro  # 迁移脚本热同步（容器内可见，免重建镜像）
      - ../../scripts:/app/scripts:ro  # 运维/初始化/同步脚本（热重载）
      - ./entrypoint.sh:/app/entrypoint.sh:ro  # 启动入口：先迁移后启动
      - ${OMICHUB_DATA_ROOT:-/data/omichub}:/data/omichub  # 任务数据（与独立 worker 栈共享同一宿主目录）
      - ${OMICHUB_DATA_ROOT:-/data/omichub}/logs/app:/app/logs  # 应用日志持久化到宿主机
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket（沙盒/终端容器管理）
    networks:
      - app_net
      - data_net
      - omichub_net        # 跨栈外部网络：与独立 worker 栈（docker-compose.worker.yml）互通
      - omichub-sandbox-net # 终端沙盒网络：WebSocket 代理经容器 DNS 直连 ttyd（端口 7681）
    # 启动入口：先跑 alembic upgrade head（保证 schema 与代码同步），再启动 uvicorn。
    # 历史教训：曾因迁移未进容器 + create_all 不补字段，导致 users.storage_quota 缺列引发 500。
    entrypoint: ["/bin/sh", "/app/entrypoint.sh"]
    # 生产模式启动：多 worker + 关闭热重载（避免 watchdog 扫描 src 的首次加载开销）
    command: ["uvicorn", "omichub.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    ports:
      # 仅供跨机器 Worker 上报流程监控；单机时默认仅本机可访问。
      - "${OMICHUB_WEB_BIND_HOST:-127.0.0.1}:${OMICHUB_WEB_PORT:-8000}:8000"

  # ===== OmicStudio 域名白名单出站代理 =====
  # 仅加入独立公网 bridge；Manager 会按会话把它动态接入临时 internal 网络。
  studio-egress-proxy:
    build:
      context: ../studio
      dockerfile: proxy.Dockerfile
    container_name: omichub-studio-egress-proxy
    restart: unless-stopped
    logging: *default-logging
    user: "10002:10002"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    environment:
      - STUDIO_CONFIG_PATH=/config/studio.yaml
      - STUDIO_PROXY_PORT=3128
      - STUDIO_PROXY_MAX_CONNECTIONS=128
    volumes:
      - ../../data/ai/studio.yaml:/config/studio.yaml:ro
    networks:
      - studio_proxy_egress
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',3128),2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===== Celery Beat 定时器（留在主栈，单实例） =====
  # 注：计算型 worker 已拆分至独立编排栈 deploy/docker/docker-compose.worker.yml，
  beat:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SNAKEMAKE_LOGGER_PLUGIN_REF: ${SNAKEMAKE_LOGGER_PLUGIN_REF:-main}
        # 由 Makefile 部署 target 导出（git rev-parse --short HEAD / UTC 构建时间），缺省 unknown。
        OMICHUB_BUILD_SHA: ${OMICHUB_BUILD_SHA:-unknown}
        OMICHUB_BUILD_TIME: ${OMICHUB_BUILD_TIME:-unknown}
    container_name: omichub-beat
    restart: unless-stopped
    logging: *default-logging
    user: "${PUID:-1000}:${PGID:-1000}"   # 以宿主用户运行，避免 root
    env_file:
      - ../../.env
    environment:
      - APP_ENV=development
      - POSTGRES_HOST=db
      - REDIS_HOST=cache
      - SERVICE_NAME=beat
      - PYTHONPATH=/app/src
      - AL_API_KEY=${AL_API_KEY}
      - ARK_API_KEY=${ARK_API_KEY}
      - HOME=/tmp                          # uid 1000 无 passwd 条目，显式 HOME 防 expanduser 失败
      - OMICHUB_LOG_DIR=/app/logs
    depends_on:
      - web                  # worker 已迁独立栈，beat 仅需主栈启动顺序保证
    volumes:
      - ../../src:/app/src:ro  # 开发环境热重载
      - ../../alembic:/app/alembic:ro  # 迁移脚本（与 web 一致，便于排障时 exec alembic）
      - ${OMICHUB_DATA_ROOT:-/data/omichub}/logs/app:/app/logs  # 应用日志持久化到宿主机
    networks:
      - app_net
      - data_net
      - omichub_net          # beat 须经服务名 cache 连 Redis
    working_dir: /tmp        # celerybeat-schedule 默认写 CWD；/app 不可写，改 /tmp（1777 可写）
    command: celery -A omichub.infrastructure.celery_app.celery beat --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; os.kill(1, 0)\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ===== Flower 监控 =====
  flower:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SNAKEMAKE_LOGGER_PLUGIN_REF: ${SNAKEMAKE_LOGGER_PLUGIN_REF:-main}
        # 由 Makefile 部署 target 导出（git rev-parse --short HEAD / UTC 构建时间），缺省 unknown。
        OMICHUB_BUILD_SHA: ${OMICHUB_BUILD_SHA:-unknown}
        OMICHUB_BUILD_TIME: ${OMICHUB_BUILD_TIME:-unknown}
    container_name: omichub-flower
    restart: unless-stopped
    logging: *default-logging
    user: "${PUID:-1000}:${PGID:-1000}"   # 以宿主用户运行，避免 root
    env_file:
      - ../../.env
    environment:
      - APP_ENV=development
      - POSTGRES_HOST=db
      - REDIS_HOST=cache
      - HOME=/tmp                          # uid 1000 无 passwd 条目，显式 HOME 防 expanduser 失败
    ports:
      - "${OMICHUB_FLOWER_BIND_HOST:-127.0.0.1}:${OMICHUB_FLOWER_PORT:-5555}:5555"
    depends_on:
      - web                  # 监控独立 worker 栈，同网络可连
    networks:
      - app_net
      - data_net
      - omichub_net          # flower 经网络发现跨栈 worker
    command: celery -A omichub.infrastructure.celery_app.celery flower --port=5555 --basic_auth=${FLOWER_BASIC_AUTH:-admin:flower}
    healthcheck:
      # flower 启用了 basic_auth，健康检查必须带凭据，否则恒 401 → unhealthy
      test: ["CMD", "curl", "-f", "-u", "${FLOWER_BASIC_AUTH:-admin:flower}", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ===== PostgreSQL =====
  db:
    # ⚠ 必须带 pgvector：memory_facts、agent_memories、kb_chunks 均依赖。
    # 用回 postgres:14-alpine 会因缺 $libdir/vector 使所有向量列操作报错（26.8.4 教训）。
    # pgvector/pgvector:pg14 与 postgres:14 数据格式兼容；pgvector overlay 文件保留兼容旧用法。
    image: pgvector/pgvector:pg14
    container_name: omichub-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omichub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omichub_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-omichub}
    ports:
      - "${OMICHUB_POSTGRES_BIND_HOST:-127.0.0.1}:${OMICHUB_POSTGRES_PORT:-5432}:5432"
    volumes:
      # bind mount：数据固化到 /data/omichub/omichub_data/_pgdata，便于跨平台迁移（rsync omichub_data 即可带走）
      - ${OMICHUB_DATA_ROOT:-/data/omichub}/omichub_data/_pgdata:/var/lib/postgresql/data
    networks:
      - data_net
      - omichub_net        # 跨栈：独立 worker 经服务名 db 连库（与 cache 同款跨栈互通）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omichub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Redis =====
  cache:
    image: redis:7-alpine
    container_name: omichub-cache
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${OMICHUB_REDIS_BIND_HOST:-127.0.0.1}:${OMICHUB_REDIS_PORT:-6379}:6379"
    volumes:
      # bind mount：数据固化到 /data/omichub/omichub_data/_redis，便于跨平台迁移
      - ${OMICHUB_DATA_ROOT:-/data/omichub}/omichub_data/_redis:/data
    networks:
      - data_net
      - omichub_net          # 关键：独立 worker 栈经服务名 cache 连 Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== MinIO 对象存储（AgentTeams agent 间共享产物 / case 级数据区） =====
  # web 经 data_net 访问；omichub_net 供跨栈（agentteams bridge/worker）经服务名 minio 直连
  minio:
    image: minio/minio:latest
    container_name: omichub-minio
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?missing MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?missing MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${OMICHUB_MINIO_BIND_HOST:-127.0.0.1}:${OMICHUB_MINIO_PORT:-9000}:9000"
      - "${OMICHUB_MINIO_BIND_HOST:-127.0.0.1}:${OMICHUB_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      # bind mount：数据固化到 /data/omichub/omichub_data/_minio，便于跨平台迁移（与 _redis 同款）
      - ${OMICHUB_DATA_ROOT:-/data/omichub}/omichub_data/_minio:/data
    networks:
      - data_net
      - omichub_net          # 跨栈：agentteams 栈加入 omichub_net 后经 http://minio:9000 访问
    healthcheck:
      test: ["CMD-SHELL", "mc alias set local http://127.0.0.1:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null 2>&1 && mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 6

  # 一次性初始化：建 AgentTeams 共享 bucket（幂等，mb --ignore-existing）
  # MINIO_AGENTTEAMS_BUCKET 供主后端证据区；MINIO_AGENTTEAMS_BRIDGE_BUCKET 供
  # Bridge 持久层（cases/{case_id}/events + snapshot，Part 1 MinIO 化改造）。
  minio-init:
    image: minio/mc:latest
    container_name: omichub-minio-init
    logging: *default-logging
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set omichub http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        && mc mb --ignore-existing "omichub/$${MINIO_AGENTTEAMS_BUCKET}"
        && mc anonymous set none "omichub/$${MINIO_AGENTTEAMS_BUCKET}"
        && mc mb --ignore-existing "omichub/$${MINIO_AGENTTEAMS_BRIDGE_BUCKET}"
        && mc anonymous set none "omichub/$${MINIO_AGENTTEAMS_BRIDGE_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_AGENTTEAMS_BUCKET: ${MINIO_AGENTTEAMS_BUCKET:-agentteams-evidence}
      MINIO_AGENTTEAMS_BRIDGE_BUCKET: ${MINIO_AGENTTEAMS_BRIDGE_BUCKET:-agentteams}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - data_net
    restart: "no"

  # ===== RocketMQ（可选；docker compose --profile rocketmq up -d） =====
  # Celery 仍可同时运行。通过 TASK_QUEUE_BACKEND=hybrid 与
  # ROCKETMQ_TASK_ROUTES 逐项迁移任务，不要把同一任务路由到两边。
  rocketmq-namesrv:
    image: ${ROCKETMQ_IMAGE:-apache/rocketmq:5.3.2}
    container_name: omichub-rocketmq-namesrv
    profiles: ["rocketmq"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    command: sh mqnamesrv
    ports:
      - "${OMICHUB_ROCKETMQ_NAMESRV_BIND_HOST:-127.0.0.1}:${OMICHUB_ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    networks:
      - omichub_net

  rocketmq-broker:
    image: ${ROCKETMQ_IMAGE:-apache/rocketmq:5.3.2}
    container_name: omichub-rocketmq-broker
    profiles: ["rocketmq"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms256m -Xmx512m -Xmn256m"
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    depends_on:
      - rocketmq-namesrv
    ports:
      - "${OMICHUB_ROCKETMQ_BROKER_BIND_HOST:-127.0.0.1}:${OMICHUB_ROCKETMQ_BROKER_VIP_PORT:-10909}:10909"
      - "${OMICHUB_ROCKETMQ_BROKER_BIND_HOST:-127.0.0.1}:${OMICHUB_ROCKETMQ_BROKER_PORT:-10911}:10911"
      - "${OMICHUB_ROCKETMQ_BROKER_BIND_HOST:-127.0.0.1}:${OMICHUB_ROCKETMQ_BROKER_FAST_PORT:-10912}:10912"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf:ro
    networks:
      - omichub_net

  # ===== 可选 embedding 服务：独立 ollama 容器，仅 app_net 内可达 =====
  ollama-embed:
    profiles: ["embed-ollama"]
    image: ollama/ollama:latest
    container_name: omichub-embed
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - omichub_embed:/root/.ollama
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  omichub_embed:
    external: true

networks:
  app_net:
    driver: bridge
  data_net:
    driver: bridge
  omichub_net:               # 跨栈外部网络：供独立计算栈 docker-compose.worker.yml 加入
    name: ${OMICHUB_NETWORK_NAME:-omichub_net}
    external: true           # 需先 `docker network create omichub_net` 创建
  omichub-sandbox-net:       # 终端沙盒网络：由 Makefile docker-network 创建
    name: ${OMICHUB_SANDBOX_NETWORK_NAME:-omichub-sandbox-net}
    external: true
  studio_proxy_egress:       # 仅代理容器加入；不连接 Web/DB/Redis 等平台网络
    driver: bridge

# 注：pg_data / redis_data 已改为 bind mount（/data/omichub/omichub_data/_pgdata、_redis），
#     不再需要命名卷声明。旧卷 docker_pg_data / docker_redis_data 可在验证无误后删除。
