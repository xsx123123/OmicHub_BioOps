# ============================================
# CygnusX Docker Compose - 跨机部署 Worker 计算栈覆盖
# 用法:
#   docker compose \
#     -f deploy/docker/docker-compose.worker.yml \
#     -f deploy/docker/docker-compose.cross-worker.yml \
#     up -d
#
# 前置条件:
#   1. Worker 服务器已将共享数据存储挂载到 WORKER_SHARED_DATA_DIR。
#   2. 已在 .env 设置 CYGNUSX_CONTROL_HOST 和控制面端口。
#   3. Worker 服务器能访问控制面的 Web、PostgreSQL、Redis 端口。
# ============================================

services:
  rocketmq-worker:
    environment:
      - APP_ENV=production
      - POSTGRES_HOST=${CYGNUSX_CONTROL_HOST:?Set CYGNUSX_CONTROL_HOST in .env}
      - POSTGRES_PORT=${CYGNUSX_CONTROL_POSTGRES_PORT:-5432}
      - REDIS_HOST=${CYGNUSX_CONTROL_HOST:?Set CYGNUSX_CONTROL_HOST in .env}
      - REDIS_PORT=${CYGNUSX_CONTROL_REDIS_PORT:-6379}
      - ROCKETMQ_NAMESRV_ADDR=${CYGNUSX_CONTROL_HOST:?Set CYGNUSX_CONTROL_HOST in .env}:${CYGNUSX_CONTROL_ROCKETMQ_NAMESRV_PORT:-9876}
      - SERVICE_NAME=rocketmq-worker
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@${CYGNUSX_CONTROL_HOST:?Set CYGNUSX_CONTROL_HOST in .env}:${CYGNUSX_CONTROL_REDIS_PORT:-6379}/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@${CYGNUSX_CONTROL_HOST:?Set CYGNUSX_CONTROL_HOST in .env}:${CYGNUSX_CONTROL_REDIS_PORT:-6379}/2
      - CYGNUSX_LOG_DIR=/app/logs
    networks:
      - default

  worker:
    environment:
      - APP_ENV=production
      # 跨机访问必须使用控制面的私网 IP 或内部 DNS 名称。
      - POSTGRES_HOST=${CYGNUSX_CONTROL_HOST:?Set CYGNUSX_CONTROL_HOST in .env}
      - POSTGRES_PORT=${CYGNUSX_CONTROL_POSTGRES_PORT:-5432}
      - REDIS_HOST=${CYGNUSX_CONTROL_HOST:?Set CYGNUSX_CONTROL_HOST in .env}
      - REDIS_PORT=${CYGNUSX_CONTROL_REDIS_PORT:-6379}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@${CYGNUSX_CONTROL_HOST:?Set CYGNUSX_CONTROL_HOST in .env}:${CYGNUSX_CONTROL_REDIS_PORT:-6379}/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@${CYGNUSX_CONTROL_HOST:?Set CYGNUSX_CONTROL_HOST in .env}:${CYGNUSX_CONTROL_REDIS_PORT:-6379}/2
      - SERVICE_NAME=worker
      - CYGNUSX_LOG_DIR=/app/logs
      - CYGNUSX_CELERY_LOG_DIR=${STORAGE_PATH:-/data/cygnusx}/logs/celery/tasks
      # 流程监控 token：优先 CYGNUSX_WORKFLOW_MONITOR_TOKEN，否则 fallback 到 WORKFLOW_MONITOR_INGEST_TOKEN
      - CYGNUSX_WORKFLOW_MONITOR_TOKEN=${CYGNUSX_WORKFLOW_MONITOR_TOKEN:-${WORKFLOW_MONITOR_INGEST_TOKEN}}
      # 关键：流程监控 ingest URL 必须指向 Web 服务器真实地址
      - WORKFLOW_MONITOR_INTERNAL_URL=http://${CYGNUSX_CONTROL_HOST:?Set CYGNUSX_CONTROL_HOST in .env}:${CYGNUSX_CONTROL_WEB_PORT:-8000}/api/v1/workflow-monitor
    # Worker 不需要加入 Web 侧的外部网络，使用本机默认 bridge 即可
    networks:
      - default

  phylo-worker:
    environment:
      - APP_ENV=production
      - POSTGRES_HOST=${CYGNUSX_CONTROL_HOST:?Set CYGNUSX_CONTROL_HOST in .env}
      - POSTGRES_PORT=${CYGNUSX_CONTROL_POSTGRES_PORT:-5432}
      - REDIS_HOST=${CYGNUSX_CONTROL_HOST:?Set CYGNUSX_CONTROL_HOST in .env}
      - REDIS_PORT=${CYGNUSX_CONTROL_REDIS_PORT:-6379}
      - SERVICE_NAME=phylo-worker
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@${CYGNUSX_CONTROL_HOST:?Set CYGNUSX_CONTROL_HOST in .env}:${CYGNUSX_CONTROL_REDIS_PORT:-6379}/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@${CYGNUSX_CONTROL_HOST:?Set CYGNUSX_CONTROL_HOST in .env}:${CYGNUSX_CONTROL_REDIS_PORT:-6379}/2
      - CYGNUSX_LOG_DIR=/app/logs
    networks:
      - default

# 覆盖原文件中的 external network，避免 Worker 服务器因缺少外部网络而启动失败
networks:
  cygnusx_net:
    name: ${CYGNUSX_WORKER_NETWORK_NAME:-cygnusx_worker_net}
    external: false
    driver: bridge
