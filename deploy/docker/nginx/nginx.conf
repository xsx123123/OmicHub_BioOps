# CygnusX Nginx 配置 - 开发环境

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式（JSON 结构化，便于 Loki/Promtail 抓取）
    log_format cygnusx_json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"service":"nginx",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$http_x_request_id",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log cygnusx_json;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # 允许大文件分块上传：单个分片默认 5MiB，留余量设 64m。
    # 不设此项时 nginx 默认 1MB，会直接返 413 拦截分片请求（请求到不了后端）。
    client_max_body_size 64m;

    # BLAST 数据库 FASTA 上传：允许完整上传大文件（最大 10GB）。
    # 生产环境建议改为前端分片上传 + 后端合并，避免一次性大请求占用内存。
    map_hash_bucket_size 128;

    # ===== Gzip 压缩（首次加载核心优化，1.7MB JS → ~480KB）=====
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               application/rss+xml application/atom+xml image/svg+xml
               font/woff font/woff2 application/font-woff application/font-woff2;

    # WebSocket 支持
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 限流
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream cygnusx_backend {
        server web:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # 通用安全响应头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 前端静态资源根目录（开发环境挂载 frontend/dist）
        root /usr/share/nginx/html;
        index index.html;

        # API 代理（同时支持 HTTP 与 WebSocket Upgrade）
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://cygnusx_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;  # WebSocket 长连接超时
        }

        # 分块上传：放宽限流。前端 3 路并发连续打分片，burst=20 nodelay 会秒触 429，
        # 这里单独提高 burst + 去掉 nodelay 让突发请求排队而非直接拒绝。
        # client_max_body_size 已在 http 块设 64m，此处仅需放宽速率。
        location /api/v1/files/upload/ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://cygnusx_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600;  # 大文件合并可能耗时，放宽读超时
        }

        # BLAST 数据库 FASTA 源文件上传：允许单个大文件完整上传。
        # 生产环境若频繁上传 GB 级文件，建议改为分片上传并调大 proxy_read_timeout。
        location /api/v1/blast/admin/databases {
            client_max_body_size 10g;
            proxy_read_timeout 3600;
            proxy_request_buffering off;
            proxy_pass http://cygnusx_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 健康检查
        location /health {
            proxy_pass http://cygnusx_backend;
        }

        # 协议文件静态化：优先从 frontend/dist/docs 直接提供，避免与 /docs API 文档代理冲突
        location = /docs/platform-agreement.md {
            root /usr/share/nginx/html;
            try_files /docs/platform-agreement.md =404;
            default_type text/plain;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # API 文档（开发环境）
        location /docs {
            proxy_pass http://cygnusx_backend;
        }

        # 知识库图片等静态资源转发到后端 docs 目录
        # 必须用 ^~ 前缀匹配，否则下方正则 \.(jpg|png...)$ 会抢占 docs-static 下的图片请求导致 404
        location ^~ /docs-static/ {
            proxy_pass http://cygnusx_backend;
        }

        # Flower 监控代理
        location /flower/ {
            proxy_pass http://flower:5555/;
            proxy_set_header Host $host;
        }

        # ===== JBrowse 2 基因组浏览器 =====
        # 静态产物（webpack 打包的 hash 化 JS/CSS）。必须用 ^~ 前缀，否则下方
        # 正则 \.(js|css|...)$ 会抢占 /jbrowse2/static/*.js 请求导致 404。
        location ^~ /jbrowse2/ {
            alias /var/www/jbrowse2/;
            try_files $uri $uri/ =404;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # 数据文件访问（参考基因组 FASTA/BAM/BigWig/VCF 等）。
        # JBrowse 2 通过 HTTP Range Request 流式读取大文件，nginx 原生支持 Range。
        # ⚠️ 安全：本路径仅允许 RFC1918 内网 IP 访问；公网/多租户场景请改用后端鉴权代理或 VPN。
        location ^~ /tracks/ {
            alias /data/cygnusx/;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Content-Type" always;
            add_header Accept-Ranges bytes always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # 根路径 - SPA fallback（前端构建产物不存在时 404）
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # index.html 禁止缓存，避免更新后浏览器仍加载旧 JS
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
