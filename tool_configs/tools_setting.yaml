# ============================================
# CygnusX 工具箱前端注册表
# ============================================
# 定义「哪些工具会被加载到前端工具箱」+ 每张工具卡片的展示元数据。
# 前端 GET /api/v1/tools 拉取 enabled=true 的工具，按 order 升序渲染 ToolsHub 卡片。
#
# 改完即生效：配置加载器按文件 mtime 自动热重载，无需重启后端；
# 想强制立即生效可调 POST /api/v1/tools/reload（管理员）。
#
# 字段说明：
#   key         工具唯一标识（同时是前端路由 token，须与 router/index.ts 的 tools/<key> 一致）
#   title       卡片标题
#   description 卡片描述
#   icon        图标字符串 key，前端 ToolsHubView 的 ICON_MAP 映射回 @vicons/ionicons5 组件
#               （新增图标须在 ICON_MAP 登记，Vue 组件不能由字符串动态 import 而不经打包）
#   gradient    卡片图标背景渐变（CSS linear-gradient）
#   route       点击卡片跳转的前端路由
#   group       工具分组 key：sequence / visualization / genome / function / environment
#   enabled     false 则不出现在工具箱（软下线，不改代码）
#   order       卡片排序，升序
#   config_dir  该工具「功能配置」所在目录（相对仓库根），仅展示用；
#               展示元数据集中在本文件，功能配置放 tool_configs/<工具名>/（如 jbrowse/、enrichments/）。
#               无后端配置的纯前端工具（blast / plot）留空。
#
# 新增工具：
#   1. 在 tools 列表追加一项；
#   2. 若用了新图标，在 frontend ToolsHubView.vue 的 ICON_MAP 登记组件；
#   3. 若该工具有后端配置，新建 tool_configs/<工具名>/ 目录放 YAML，并在 config_dir 指明；
#   4. 在 frontend/src/router/index.ts 加 tools/<key> 子路由（指向工具页组件）。
# --------------------------------------------

tools:
  - key: "fastq-qc"
    title: "FASTQ 极速质控"
    description: "高通量测序数据质量评估与清洗，支持 Phred 过滤、接头去除、长度截断"
    icon: "ScanOutline"
    gradient: "linear-gradient(135deg, #165DFF 0%, #6B8DD6 100%)"
    route: "/tools/fastq-qc"
    group: "sequence"
    enabled: true
    order: 10
    config_dir: "fastq_qc"

  - key: "jbrowse"
    title: "Web 基因组浏览器"
    description: "基于 JBrowse 2，支持 BAM / BigWig / VCF / GFF3 在线浏览，外置 YAML 配置参考基因组"
    icon: "LayersOutline"
    gradient: "linear-gradient(135deg, #722ED1 0%, #B37FEB 100%)"
    route: "/tools/jbrowse"
    group: "genome"
    enabled: true
    order: 20
    config_dir: "tool_configs/jbrowse"

  - key: "blast"
    title: "序列检索 BLAST"
    description: "本地化序列比对检索，支持水稻泛基因组、生菜转录本等自定义数据库"
    icon: "SearchOutline"
    gradient: "linear-gradient(135deg, #FF7D00 0%, #FF9A2E 100%)"
    route: "/tools/blast"
    group: "sequence"
    enabled: true
    order: 30
    config_dir: ""

  - key: "plot"
