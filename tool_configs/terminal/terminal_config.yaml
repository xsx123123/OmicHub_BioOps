# ============================================
# OmicHub 云端沙盒终端配置
# ============================================
# 修改本文件后：配置加载器基于 mtime 自动热重载，无需重启后端。
#
# 设计原则：
#   - 即用即毁：容器退出后自动销毁，不留任何进程、文件系统残留
#   - 零 Root：容器内外均以非特权用户运行
#   - 目录隔离：仅挂载用户个人工作目录，禁止访问宿主机系统路径
#   - 资源受限：内存、CPU、进程数、磁盘均有硬上限
#
# 挂载路径说明：
#   workspace_base 为用户目录的宿主机基路径，运行时拼接 /{user_id}/
#   并将 workspace、raw_data、temp 三个顶层目录挂载到容器内对应路径（rw），会话结束后数据保留。
#   /tmp 和 .cache 使用 tmpfs（内存文件系统），随容器销毁。

# --------------------------------------------
# 功能开关
# --------------------------------------------
enabled: true

# --------------------------------------------
# 容器镜像
# --------------------------------------------
image:
  name: "omichub/sandbox-terminal"
  tag: "latest"
  pull_policy: "IfNotPresent"

# --------------------------------------------
# 默认资源配额
# 用户可在前端申请覆盖，但受 max_resources 限制
# --------------------------------------------
default_resources:
  memory_mb: 16000
  cpu_cores: 4
  pid_limit: 100
  tmpfs_size_mb: 100000

# --------------------------------------------
# 资源上限（硬限制，防止滥用）
# --------------------------------------------
max_resources:
  memory_mb: 32000
  cpu_cores: 8
  pid_limit: 500
  tmpfs_size_mb: 200000

# --------------------------------------------
# 会话生命周期
# --------------------------------------------
lifecycle:
  idle_timeout: 1800          # 30 分钟无操作自动销毁（秒）
  disconnect_timeout: 300     # WebSocket 断连后 5 分钟销毁（秒）
  max_session_duration: 7200  # 单次会话最长 2 小时（秒）
  max_sessions_per_user: 2    # 每个用户同时最多 2 个活跃会话

# --------------------------------------------
# 安全策略
# --------------------------------------------
security:
  read_only_root: true
  cap_drop_all: true
  no_new_privileges: true

# --------------------------------------------
# 网络配置
# --------------------------------------------
network:
  name: "omichub-sandbox-net"
  mode: "bridge"

# --------------------------------------------
# 存储配置
# --------------------------------------------
storage:
  workspace_base: "/data/omichub/users"

# --------------------------------------------
# 端口分配范围（ttyd 映射到宿主机的高位端口）
# --------------------------------------------
port_range:
  base: 20000
  max: 30000
