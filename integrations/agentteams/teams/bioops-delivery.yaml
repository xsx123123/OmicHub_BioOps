# 注意：本文件为描述性文档，无任何代码加载（全仓检索仅 README 提及）。
# 角色事实源是 data/ai/*.yaml 的 features.internal_case_role + features.agentteams，
# 经 capability registry（agentteams_capability_registry.py）派生并被 gateway/worker 消费。
# 修改本文件不会改变任何运行时行为；要调整角色/能力请改 data/ai/*.yaml。
schema_version: "1.0"
team_id: bioops-delivery
description: >-
  AgentTeams-side coordination only. Workers have no OmicHub database, Redis, Docker,
  shell, or data-volume access; every OmicHub action goes through the Bridge.
manager:
  identity: bioops-manager
  skills: [task-intake, approval-request, case-closeout]
  forbidden_capabilities: [workflow_submit, database_access, shell]
approval_gateway:
  identity: approval-authority
  purpose: "Human approval card resolution service; signs only short-lived scoped tokens."
  forbidden_capabilities: [workflow_submit, workflow_cancel, database_access, shell]
workers:
  - identity: agent-data
    skills: [project-preflight, evidence-retrieval]
    bridge_identity_env: AGENTTEAMS_AGENT_DATA_TOKEN
    work_inbox: "GET /v1/work-items/assigned"
    forbidden_capabilities: [workflow_submit, workflow_cancel, shell]
    # Bridge performs format checks; agent-data supplies the semantic preflight conclusion.
  - identity: workflow-operator
    skills: [workflow-submit, workflow-monitor, workflow-cancel]
    bridge_identity_env: AGENTTEAMS_WORKFLOW_OPERATOR_TOKEN
    work_inbox: "GET /v1/work-items/assigned"
    forbidden_capabilities: [database_access, shell, flow_configuration_write]
  - identity: agent-qc
    skills: [quality-gate, artifact-inspect]
    bridge_identity_env: AGENTTEAMS_AGENT_QC_TOKEN
    work_inbox: "GET /v1/work-items/assigned"
    forbidden_capabilities: [workflow_submit, workflow_cancel, shell]
  - identity: agent-delivery
    skills: [delivery-pack, runbook-capture]
    bridge_identity_env: AGENTTEAMS_AGENT_DELIVERY_TOKEN
    work_inbox: "GET /v1/work-items/assigned"
    forbidden_capabilities: [workflow_submit, workflow_cancel, shell]
  - identity: agent-code
