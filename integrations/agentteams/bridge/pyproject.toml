[project]
name = "omichub-agentteams-bridge"
version = "0.1.0"
description = "Non-invasive AgentTeams control-plane bridge for OmicHub"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "minio>=7.2.0",
    "pydantic-settings>=2.1.0",
    "redis>=5.0.0",
    "uvicorn[standard]>=0.27.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
