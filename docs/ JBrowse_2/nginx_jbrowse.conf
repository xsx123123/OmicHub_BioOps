# ============================================================
# Nginx 配置片段：JBrowse 2 集成
# 插入到现有的 nginx.conf 或 nginx.prod.conf 中
# ============================================================

# JBrowse 2 静态产物
# 注意：路径末尾的 / 很重要，否则 JS/CSS 资源会 404
location /jbrowse2/ {
    alias /usr/share/nginx/html/jbrowse2/;
    try_files $uri $uri/ /jbrowse2/index.html;

    # 长期缓存静态资源
    expires 30d;
    add_header Cache-Control "public, immutable";

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# 数据文件访问（支持 HTTP Range Request，对大文件浏览至关重要）
# 注意：这里暴露的是 /data/cygnusx 目录，建议加 IP 限制或认证
location /tracks/ {
    alias /data/cygnusx/;

    # 允许跨域（JBrowse 2 需要）
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Content-Type" always;

    # 支持 Range Request（BAM/BigWig 浏览必需）
    add_header Accept-Ranges bytes always;

    # 大文件优化
    proxy_buffering off;

    # 可选：限制访问（推荐内网或加认证）
    # allow 10.0.0.0/8;
    # allow 172.16.0.0/12;
    # allow 192.168.0.0/16;
    # deny all;
}

# JBrowse API 反代（如果 Nginx 和 web 容器在同一网络）
# 如果已有 /api/ 的统一反代，这部分可能不需要
location /api/jbrowse/ {
    proxy_pass http://web:8000/api/jbrowse/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 上传大文件需要调大超时
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
