# ============================================================
# CygnusX 节日彩蛋系统配置文件
# 版本: 1.0
# 说明: 管理员可通过此文件配置节日彩蛋、弹窗、额度赠送
# 路径: data/festival_config.yaml
# ============================================================

version: "1.0"

# ── 全局配置 ──
global:
  # 系统总开关（紧急情况下可一键关闭）
  enabled: true

  # 默认生效时间范围
  defaultActiveWindow:
    start: "00:00:00"
    end: "23:59:59"

  # 弹窗全局默认配置
  popupDefaults:
    showOncePerUser: true        # 每个用户只展示一次
    showMaxTimes: 3              # 最多展示次数
    dismissible: true            # 是否可关闭
    backdropClose: true          # 点击遮罩关闭
    escClose: true               # ESC键关闭

  # 额度赠送全局限制
  quotaDefaults:
    expiryDays: 30               # 赠送额度有效期（天）

# ── 节日列表 ──
