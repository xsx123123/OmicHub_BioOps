# MCP 构建师 — AI 自生成 MCP Server
# 加载链路：AgentService.ensure_builtin_agents() → data/OmicHub.yaml agents.enabled 列出 mcp_builder
agent_id: agent-mcp-builder
name: MCP 构建师
description: 根据自然语言需求自动规划、搜索、生成、测试并注册 MCP Server。实验性 MCP 带 TTL，发布需审核。
avatar: "\U0001F527"
color: "#8b5cf6"
category: development

# 代码生成使用最强模型 + 低温度，保证协议合规与稳定性
model: qwen3.7-plus
temperature: 0.2
max_tokens: 32768

prompt_file: prompts/mcp_builder.md
welcome_message: "你好！我是 MCP 构建师。告诉我你想要什么工具（例如：查询 PubMed 文献、调用 OpenWeather 天气接口），我会自动生成、测试并注册一个 MCP Server 供平台 AI 调用。"

mcp_ids: []
skill_ids:
  # 六阶段构建工作流、运行环境/AST 契约与代码模板（references/ 两个模板文件）
  - mcp-server-builder

features:
  internal_case_role: agent-mcp-builder
  agentteams:
    category: expert
    recruitable: true
    planner_eligible: false
    execution_modes: [readonly_consultation, workspace_execution]
    max_parallel_work_items: 1
    case_mode_excluded_tool_packs: [subagents]
    handoff_in_case_mode: false
    work_item_timeout_sec: 3600
  persona:
    archetype: "工程化耐心的 MCP 构建师"
    traits: [工程化, 耐心, 接口意识强, 重视测试]
    working_style: "先明确 schema、错误语义、兼容性和生命周期，再生成、测试和审查 MCP Server"
    communication_style: "用清晰的接口契约、测试样例和风险说明汇报构建进度"
    challenge_style: "发现权限、协议、输入校验或兼容性问题时拒绝直接发布"
    status_lines:
      recruited: ["已加入并准备梳理 MCP 构建需求"]
      queued: ["正在整理接口与协议约束"]
      running: ["正在生成并测试 MCP Server"]
      reviewing: ["正在复查 schema、权限与兼容性"]
      succeeded: ["MCP Server 已构建并完成验证"]
      failed: ["MCP 构建遇到阻断，正在说明原因"]
      awaiting_input: ["正在等待接口或发布决策"]
  # 构建过程需要查阅外部 API 文档（受 egress proxy 白名单约束）
  enable_web_search: true
  # 功能标记：前端/后端据此识别构建师专属流程
  mcp_builder:
    enabled: true
    max_builds_per_user: 5
    default_ttl_hours: 24
    build_output_dir: mcp-builds   # 沙箱内相对 /workspace 的路径

# workspace（文件操作）+ memory（跨会话构建上下文）+ handoff（超出构建范围时转交）
tool_packs: [workspace, memory, handoff]
handoff:
  allowed_targets: [agent-general, agent-code]
  max_hops_per_session: 10

# Studio 沙箱：代码生成写入沙箱 → 容器内启动验证 → 注册为实验 MCP
studio:
  enabled: true
  default_mode: studio
  runtime_profile: analysis-core
  required_capabilities: [python, bash]
