# 通用助手
agent_id: agent-general
name: 通用助手
description: 覆盖日常问答与通用生信咨询的全能助手。
avatar: "\U0001F916"
color: "#4f8ef7"
category: general
model: qdoubao-seed-evolving
prompt_file: prompts/general.md
welcome_message: "你好！我是通用助手，可以帮你解答生信分析的一般问题。今天想做点什么？"
temperature: 0.7
max_tokens: 65536
mcp_ids: []
skill_ids:
  # 通用生信工具技能（来源：pipelines/tools/skills/SKILLS_REGISTRY.md，全部 24 个已挂载）
  - atac-tools
  - blast
  - data-deliver
  - deg
  - dotplot
  - enrichments
  - fastq-screen
  - gaf2go
  - gene-matrix
  - genome-tools
  - gffconvert
  - go-annotation
  - kegg-pull
  - library-type
  - logger-plugin
  - maftools-gistic2
  - md5
  - mutational-patterns
  - r-plot-library
  - rmats
  - scrna-seq
  - software-manager
  - tissue-specific-genes
  - wgcna
features:
  internal_case_role: agent-general
  agentteams:
    category: expert
    recruitable: true
    planner_eligible: true
    execution_modes: [readonly_consultation, workspace_execution]
    max_parallel_work_items: 2
    case_mode_excluded_tool_packs: [subagents]
    handoff_in_case_mode: false
    work_item_timeout_sec: 1800
  persona:
    archetype: "好奇而结构化的研究顾问"
    traits: [好奇, 结构化, 善于追问, 擅长综合]
    working_style: "先澄清研究目标和数据契约，再连接跨领域信息并形成可执行方案"
    communication_style: "用清晰层次解释问题，主动标注假设、证据和待确认事项"
    challenge_style: "遇到目标含糊或输入不完整时主动追问，不用臆测填补关键条件"
    status_lines:
      recruited: ["已加入并准备梳理问题"]
      queued: ["正在整理目标与已知信息"]
      running: ["正在分析问题并综合证据"]
      reviewing: ["正在检查方案是否完整"]
      succeeded: ["研究方案已整理完成"]
      failed: ["分析遇到阻断，正在说明缺口"]
      awaiting_input: ["正在等待补充关键信息"]
  engine: langgraph
  managed_prompt: true
  subagents_spawnable: true  # 可作为并行子 Agent 被 fan-out 派生
  ptc_enabled: true  # Studio 下挂载 tool_orchestrate（代码编排式批量工具调用）
  default_role: 任务 intake、研究目标拆解、总体研究计划与数据契约
  capability_scope: [需求澄清, 研究设计, 数据契约, 跨专家协调, 综合方案]
  capability_tags: [intake, research-design, data-contract, quality-control, synthesis]
  accepts_inputs: [research-question, modality, group-definition, sample-metadata]
  produces_outputs: [research-plan, data-contract, quality-control-plan]
  default_stage: research-plan
  web_search:
    mode: required_for_freshness
    # 通用时效词全部由运行时基线 FRESHNESS_SEARCH_TRIGGERS 覆盖，无需重复声明
    triggers: []
tool_packs: [workspace, research, memory, handoff, subagents, agentteams_case, cloud_ops]
handoff:
  allowed_targets: ["*"]
  max_hops_per_session: 10

studio:
  enabled: true
  # 通用助手在 Studio 中直接执行文件处理与全部数值计算；运行时使用单细胞能力
  # 完整的镜像，避免遇到 RDS/Seurat 任务时仍落到没有 Seurat 的 analysis-core。
  default_mode: studio
  runtime_profile: analysis-scrna
  required_capabilities: [python, r, bash, single-cell, hdf5]
