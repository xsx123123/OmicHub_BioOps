retry_policies:
  infra_bounded:
    auto_retry_on: [oom, node_lost, queue_timeout]
    max_attempts: 2
    escalate: new_revision_requires_approval
  never:
    auto_retry_on: []
    max_attempts: 1

approval_templates:
  sample_inclusion:
    approvers: [project_owner]
    quorum: all
    timeout_hours: 48
    on_timeout: remind_and_escalate
    never_auto_approve: true
    requires_reject_reason: true
  integration_approval:
    approvers: [project_owner]
    quorum: all
    timeout_hours: 48
    on_timeout: remind_and_escalate
    never_auto_approve: true
    requires_reject_reason: true
  annotation_revision:
    approvers: [project_owner]
    quorum: all
    timeout_hours: 48
    on_timeout: remind_and_escalate
    never_auto_approve: true
    requires_reject_reason: true
  trajectory_root_direction:
    approvers: [project_owner, domain_expert]
    quorum: all
    timeout_hours: 72
    on_timeout: remind_and_escalate
    never_auto_approve: true
    requires_reject_reason: true

# O5:Bridge 标准工作项默认 target(quality-auditor/delivery-reporter 为 Bridge 内置身份,
# 经 capability snapshot 的 role_agent_map 解析到实际 Agent);flow YAML 的
# standard_work_items 段可逐项覆盖。interpret 未声明时沿用 flow actor。
standard_work_item_targets:
  quality: quality-auditor
  delivery: delivery-reporter
