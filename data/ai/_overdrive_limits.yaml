summary_chars: 1500
upstream_context_chars: 8000
task_instruction_chars: 20000
max_tasks_per_session: 12
max_parallel_per_wave: 4
chain_wall_timeout_minutes: 45
stall_threshold_seconds: 120
max_intake_rounds: 3
max_repair_rounds: 1
planning:
  # Contract for plan-revision commands; consumed by the plan-decision endpoint.
  max_revision_rounds: 3
research:
  # These limits are consumed by the v2 research bundle in ChatService.
  source_timeout_seconds: 20
  # model_knowledge(模型知识归纳)是一次 800-token 的 LLM 流式调用,
  # 与检索类源共用 20s 会在端点稍慢时必超时;给它单独的更大预算。
  model_timeout_seconds: 45
  max_evidence_items_per_source: 8
  wall_timeout_seconds: 75
manager_review:
  # Rule review uses the fast path; escalated LLM review is a separate durable job.
  # max_tokens/timeout_seconds are consumed by the escalated review job.
  rule_fast_path: true
  max_tokens: 1200
  timeout_seconds: 30
default_retry:
  max_attempts: 2
  backoff_seconds: 30
default_timeout_seconds: 1800
agents: {}
